---
services:
  mindglowing_finance_nginx:
    image: nginx:latest
    container_name: mindglowing_finance_nginx
    restart: unless-stopped
    ports:
      # - 8159:80 # HTTP, don't use this
      - ${HOST_PORT}:443 # HTTPS
    volumes:
      - ./nginx/conf/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/conf/init.sh:/etc/nginx/conf.d/init.sh
      - ./nginx/ssl:/etc/nginx/certs
    networks:
      - docker_swag # Proxy network, change to name of your own proxy netwrok
      - mindglowing_finance
    env_file:
      - .env
    command: bash -c "chmod +rx /etc/nginx/conf.d/init.sh && /etc/nginx/conf.d/init.sh && nginx -g 'daemon off;'"

  mindglowing_finance_frontend:
    build:
      context: .
      dockerfile: ./Dockerfile-frontend
    container_name: mindglowing_finance_frontend
    restart: unless-stopped
    working_dir: /app
    # ports:
    # - "8161:8000" # HTTP for debugging
    volumes:
      - ./frontend/:/app
      - ./backend/uploads/:/app/uploads
      - /app/node_modules
    networks:
      - mindglowing_finance
    env_file:
      - .env

  mindglowing_finance_backend:
    build:
      context: .
      dockerfile: ./Dockerfile-backend
    container_name: mindglowing_finance_backend
    restart: unless-stopped
    working_dir: /app
    # ports:
    #   - "8162:3000" # HTTP for debugging
    volumes:
      - ./backend/:/app
      - /app/node_modules
    networks:
      - mindglowing_finance
    env_file:
      - .env

  mindglowing_finance_mongo_db:
    image: mongo
    container_name: mindglowing_finance_mongo_db
    restart: unless-stopped
    ports:
      - 27017:27017 # Enable this port for MongoDBCompass
    volumes:
      - ./mongodb/config/mongod.conf.orig:/etc/mongod.conf.orig
      - ./mongodb/db/:/data/db
      - ./mongodb/config/init-scripts/init-db.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - ./mongodb/config/update-password.js:/scripts/update-password.js
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=root-db
    env_file:
      - .env
    networks:
      - mindglowing_finance

networks:
  mindglowing_finance:
  docker_swag: # Proxy network, change to name of your own proxy netwrok
    external: true # Previously set net work
